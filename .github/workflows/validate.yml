name: Validate design platform

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate committed architecture
        run: npm run validate:architecture

      - name: Build standalone theme
        run: npm run build

      - name: Validate generated theme
        run: npm run validate
